[project]
name = "claudebox"
version = "1.7.0"
requires-python = ">=3.13"
dependencies = [
  "aiofiles>=24.0",
  "argcomplete>=3.0",
  "claude-agent-sdk>=0.1.65",
  "duckduckgo-search>=6.0",
  "fastapi>=0.115",
  "filelock>=3.0",
  "httpx>=0.27",
  "langchain>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-mcp-adapters>=0.2,<1",
  "langchain-ollama>=0.3,<2",
  "langgraph>=1.0,<2",
  # Do NOT relax to >=3.0: up to 3.0.2 the saver calls Connection.is_alive, which
  # aiosqlite 0.22 removed, and every session dies on its first turn. Fixed in 3.0.3.
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "markdownify>=0.11",
  "nbformat>=5.10",
  "pathspec>=0.12",
  "pydantic>=2.9",
  "ruamel.yaml>=0.18",
  "rich>=13.0",
  "rich-argparse>=1.6",
  "sse-starlette>=2.0",
  "starlette>=0.46",
  "structlog>=24.0",
  "tree-sitter>=0.25",
  "tree-sitter-bash>=0.25",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
web-search-tavily = [
  "langchain-tavily>=0.1",
]

# Per-provider LangChain provider extras. init_chat_model lazy-imports the
# matching langchain-<provider> package at first chat-model construction;
# missing imports surface as ProviderPackageMissing with the corresponding
# `pip install claudebox[<extra>]` hint (see _providers.PROVIDER_INSTALL_HINTS).
# Version bounds intentionally loose: provider packages adopted the
# langchain-core 1.x baseline at different cadences (e.g. langchain-aws only
# moved to a langchain-core>=1 compatible release in its 1.x line; some Tier 3
# packages remained on pre-v1 series). The lower bound only excludes archaic
# pre-langchain-v1 releases; the resolver picks the newest version compatible
# with the pinned `langchain-core>=1.0,<2` core dep.
anthropic = ["langchain-anthropic"]
openai = ["langchain-openai"]
google = ["langchain-google-genai"]
groq = ["langchain-groq"]
mistral = ["langchain-mistralai"]
bedrock = ["langchain-aws"]
cohere = ["langchain-cohere"]
fireworks = ["langchain-fireworks"]
together = ["langchain-together"]
deepseek = ["langchain-deepseek"]
xai = ["langchain-xai"]
perplexity = ["langchain-perplexity"]
nvidia = ["langchain-nvidia-ai-endpoints"]
huggingface = ["langchain-huggingface"]

# Combined bundles.
langgraph-cloud = ["claudebox[anthropic,openai,google,groq]"]
langgraph-all = ["claudebox[anthropic,openai,google,groq,mistral,bedrock,cohere,fireworks,together,deepseek,xai,perplexity,nvidia,huggingface]"]

dev = [
  "anyio[trio]>=4.0",
  "deptry>=0.25.1",
  "import-linter>=2.15",
  "inline-snapshot",
  "pytest-anyio",
  "pytest-cov",
  "pytest-httpserver>=1.0,<2",
  "pytest-socket>=0.7",
  "pytest-xdist>=3.8",
  "pytest>=8.0",
  "ruff>=0.16",
  "ty>=0.0.72",
]

[tool.deptry]
known_first_party = [
  "claudebox",
  "claudebox_cli",
  "claudebox_container_api",
  "claudebox_daemon",
  "claudebox_frontend",
]

[tool.deptry.per_rule_ignores]
# Provider packages are imported by name through init_chat_model, which deptry cannot see; the rest is
# the test and lint toolchain, imported by nothing under src/.
DEP002 = [
  "langchain-ollama",
  "langchain-anthropic",
  "langchain-openai",
  "langchain-google-genai",
  "langchain-groq",
  "langchain-mistralai",
  "langchain-aws",
  "langchain-cohere",
  "langchain-fireworks",
  "langchain-together",
  "langchain-deepseek",
  "langchain-xai",
  "langchain-perplexity",
  "langchain-nvidia-ai-endpoints",
  "langchain-huggingface",
  "anyio",
  "deptry",
  "import-linter",
  "inline-snapshot",
  "pytest",
  "pytest-anyio",
  "pytest-cov",
  "pytest-httpserver",
  "pytest-socket",
  "pytest-xdist",
  "ruff",
  "ty",
]

[tool.importlinter]
root_packages = ["claudebox", "claudebox_cli", "claudebox_container_api", "claudebox_daemon"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "framework has zero reverse dependencies (GUIDELINES.md, Framework Conventions)"
type = "forbidden"
source_modules = ["claudebox"]
forbidden_modules = ["claudebox_cli", "claudebox_container_api", "claudebox_daemon"]

[[tool.importlinter.contracts]]
name = "orchestration never imports the container API (GUIDELINES.md, Orchestration Boundary)"
type = "forbidden"
source_modules = ["claudebox.agent_session.orchestration"]
forbidden_modules = ["claudebox_container_api"]

[[tool.importlinter.contracts]]
name = "container API handlers never import session internals (GUIDELINES.md, Design Principles)"
type = "forbidden"
source_modules = ["claudebox_container_api.handlers"]
forbidden_modules = [
  "claudebox.agent_session.orchestration.pipeline",
  "claudebox.agent_session.orchestration.broadcaster",
  "claudebox.agent_session.orchestration.persistence",
]
# Handlers reach the package root, whose lazy facade reaches orchestration; the rule is about direct imports.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "daemon: app over serving over handlers over domain (GUIDELINES.md, Daemon Architecture)"
type = "layers"
containers = ["claudebox_daemon"]
layers = ["app", "serving", "handlers", "domain"]

[tool.coverage.run]
data_file = "/tmp/.coverage"
branch = true

[tool.coverage.report]
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests", "e2e/cli"]
pythonpath = ["src"]
cache_dir = "/tmp/.pytest_cache"
markers = ["anyio: mark test as async (anyio)"]
filterwarnings = []
addopts = "--disable-socket --allow-unix-socket"

[tool.inline-snapshot]
format-command = "uv run ruff format --stdin-filename {filename}"

[tool.uv]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.setuptools.packages.find]
where = ["src"]
