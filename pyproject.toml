[project]
name = "claudebox"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "aiofiles>=24.0",
  "claude-agent-sdk>=0.1.65",
  "fastapi>=0.115",
  "filelock>=3.0",
  "httpx>=0.27",
  "inflection>=0.5",
  "pathspec>=0.12",
  "ruamel.yaml>=0.18",
  "rich>=13.0",
  "sse-starlette>=2.0",
  "structlog>=24.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "anyio[trio]>=4.0",
    "inline-snapshot",
    "pytest-anyio",
    "pytest-cov",
    "pytest-socket>=0.7",
    "pytest>=8.0",
    "ruff>=0.15",
    "ty>=0.0.34",
]

[tool.coverage.run]
data_file = "/tmp/.coverage"
branch = true

[tool.coverage.report]
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests", "e2e/cli"]
pythonpath = ["src"]
cache_dir = "/tmp/.pytest_cache"
markers = ["anyio: mark test as async (anyio)"]
filterwarnings = []
addopts = "--disable-socket --allow-unix-socket"

[tool.inline-snapshot]
format-command = "uv run ruff format --stdin-filename {filename}"

[tool.uv]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.setuptools.packages.find]
where = ["src"]
