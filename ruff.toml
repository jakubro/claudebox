line-length = 100
indent-width = 4
target-version = "py313"

[format]
line-ending = "lf"

[lint]
extend-select = [
  "COM812",
  "E4",
  "E7",
  "F4",
  "F7",
  "I",
  "RUF001",
  "RUF002",
  "RUF003",
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]

[lint.isort]
case-sensitive = true
no-lines-before = ["local-folder"]
relative-imports-order = "closest-to-furthest"
lines-after-imports = 2
known-first-party = [
  "claudebox",
  "claudebox_cli",
  "claudebox_container_api",
  "claudebox_daemon",
  "claudebox_frontend",
]
